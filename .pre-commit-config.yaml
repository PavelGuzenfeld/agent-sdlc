default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: no-leaks
        name: no-leaks (identity and secret scan)
        entry: sh -c 'sh tests/no-leaks.sh && sh scripts/no-leaks.sh'
        language: system
        always_run: true
        pass_filenames: false
      - id: rules-check
        name: rules check (.claude/rules drift)
        entry: >-
          sh -c 'command -v mutation-gate >/dev/null 2>&1 || {
          echo "rules-check: skipped (not on PATH — see install.sh --deps)"; exit 0; };
          exec mutation-gate rules check'
        language: system
        always_run: true
        pass_filenames: false
      - id: mutation-gate
        name: mutation gate (diff-scoped)
        entry: >-
          sh -c 'command -v mutation-gate >/dev/null 2>&1 || {
          echo "mutation-gate: skipped (not on PATH — see install.sh --deps)"; exit 0; };
          exec mutation-gate --staged'
        language: system
        files: ^(mutation_gate|skills/sol-budget/scripts)/.*\.py$
        pass_filenames: false
      - id: commit-msg
        name: commit message check (voice.md banned words, attribution, sign-off)
        entry: >-
          sh -c 'command -v mutation-gate >/dev/null 2>&1 || {
          echo "commit-msg: skipped (not on PATH — see install.sh --deps)"; exit 0; };
          exec mutation-gate commit-msg "$1"' _
        language: system
        stages: [commit-msg]
      - id: diff-discipline
        name: diff discipline (branch line limit without a ticket reference)
        entry: >-
          sh -c 'command -v mutation-gate >/dev/null 2>&1 || {
          echo "diff-discipline: skipped (not on PATH — see install.sh --deps)"; exit 0; };
          exec mutation-gate diff-discipline "$1"' _
        language: system
        stages: [commit-msg]
      - id: no-new-docs
        name: no new docs (newly added .md files must be allowlisted)
        entry: >-
          sh -c 'command -v mutation-gate >/dev/null 2>&1 || {
          echo "no-new-docs: skipped (not on PATH — see install.sh --deps)"; exit 0; };
          exec mutation-gate no-new-docs'
        language: system
        always_run: true
        pass_filenames: false
      - id: no-leaks
        name: no-leaks (identity/RFC1918/home-path scan plus optional banned_names_file)
        entry: >-
          sh -c 'command -v mutation-gate >/dev/null 2>&1 || {
          echo "no-leaks: skipped (not on PATH — see install.sh --deps)"; exit 0; };
          exec mutation-gate no-leaks "$1"' _
        language: system
        stages: [commit-msg]
