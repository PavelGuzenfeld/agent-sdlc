site_name: agent-sdlc
site_description: Software development lifecycle as installable agent config for Claude Code and Codex.
site_url: https://pavelguzenfeld.com/agent-sdlc/
repo_url: https://github.com/PavelGuzenfeld/agent-sdlc
repo_name: PavelGuzenfeld/agent-sdlc
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Techniques: techniques.md
  - SDLC: sdlc.md
  - Gate: gate.md
  - CLI: cli.md
  - Config: config.md
  - Commands: commands.md
  - Hooks and tools: tools.md
  - Debugging: debugging.md
  - Reporting: reporting.md
  - Rules: rules.md
  - Skills: skills.md

hooks:
  - scripts/mkdocs_toc.py

validation:
  links:
    not_found: info
