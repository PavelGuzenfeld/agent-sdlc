[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sdlc"
description = "Diff-scoped mutation gate for pre-commit and agent Stop hooks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["ast-grep-cli"]

[project.scripts]
mutation-gate = "mutation_gate.cli:main"

[project.urls]
Homepage = "https://github.com/PavelGuzenfeld/agent-sdlc"

[tool.setuptools]
packages = ["mutation_gate", "mutation_gate.bundled_rules"]

[tool.setuptools.package-dir]
"mutation_gate.bundled_rules" = "rules"

[tool.setuptools.package-data]
"mutation_gate" = ["*.toml"]
"mutation_gate.bundled_rules" = ["*.md"]

[tool.setuptools.dynamic]
version = { attr = "mutation_gate.__version__" }
