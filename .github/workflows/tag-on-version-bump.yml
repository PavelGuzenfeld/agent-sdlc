name: Tag on version bump

on:
  push:
    branches: [main]
    paths:
      - 'mutation_gate/__init__.py'

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag the new version and start the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' mutation_gate/__init__.py)
          [ -n "$version" ] || { echo "no __version__ in mutation_gate/__init__.py" >&2; exit 1; }
          tag="v$version"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists, nothing to release"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          gh workflow run release.yml --ref "$tag"
