name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  no-leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/no-leaks.sh
      - run: sh tests/no-leaks-env.sh
      - run: sh scripts/no-leaks.sh

  sol-budget-tests:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy pytest pyyaml
      - run: pytest skills/sol-budget/tests

  bin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/git-guardrail.sh && sh tests/merge-claude-hook.sh

  mutation-gate-tests:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - run: pip install --no-cache-dir -e ".[vocabulary]" pytest pytest-cov pyyaml ast-grep-cli
      - run: mkdir -p /usr/share/nltk_data && python -c "import nltk; nltk.download('wordnet', download_dir='/usr/share/nltk_data')"
      - run: ast-grep --version
      - run: pytest -q mutation_gate/tests

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/install.sh

  pre-commit-range:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install --no-cache-dir -e . pre-commit
      - run: |
          git config --global --add safe.directory "$PWD"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base=$(git merge-base origin/main HEAD)
          else
            base=HEAD~1
          fi
          SKIP=mutation-gate pre-commit run --from-ref "$base" --to-ref HEAD
          mutation-gate commit-msg --range "$base..HEAD"
          mutation-gate diff-discipline --range "$base..HEAD" --branch "${{ github.head_ref || github.ref_name }}"
          mutation-gate no-new-docs --range "$base..HEAD"
          mutation-gate no-leaks --range "$base..HEAD"

  rules-check-hook:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - run: pip install --no-cache-dir -e . pre-commit
      - run: |
          git config --global --add safe.directory "$PWD"
          sh tests/rules-check-hook.sh
          sh tests/commit-msg-hook.sh
          sh tests/diff-discipline-hook.sh
          sh tests/no-new-docs-hook.sh
          sh tests/no-leaks-hook.sh
          sh tests/worktree-shim-hook.sh

  docs:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
