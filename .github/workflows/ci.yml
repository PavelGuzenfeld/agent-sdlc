name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  no-leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/no-leaks.sh
      - run: sh tests/no-leaks-env.sh
      - run: sh scripts/no-leaks.sh

  agents-md-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/gen-agents-md.sh
      - run: git diff --exit-code AGENTS.md

  sol-budget-tests:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy pytest pyyaml
      - run: pytest skills/sol-budget/tests

  bin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/git-guardrail.sh && sh tests/merge-claude-hook.sh

  mutation-gate-tests:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - run: pip install --no-cache-dir -e . pytest pytest-cov pyyaml ast-grep-cli
      - run: ast-grep --version
      - run: pytest -q mutation_gate/tests

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/install.sh

  docs:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
