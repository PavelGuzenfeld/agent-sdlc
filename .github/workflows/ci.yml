name: CI

on:
  push:
  pull_request:

jobs:
  no-leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/no-leaks.sh
      - run: sh scripts/no-leaks.sh

  agents-md-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/gen-agents-md.sh
      - run: git diff --exit-code AGENTS.md

  sol-budget-tests:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy pytest pyyaml
      - run: pytest skills/sol-budget/tests
