# --- the stale-waiver guard's short-circuit, from dotfiles#88 --------------------------
# The guard only decides whether to skip an extra generator pass. Every variant
# below still produces the same warnings, because `stale()` filters the same
# conditions again before anything is printed; the guard is an optimisation, and
# widening it costs a scan rather than changing an answer.

[[waiver]]
file = "mutation_gate/cli.py"
line = 57
column = 15
old = """w.file == rel and w.line and not w.uncovered"""
new = """w.file == rel and w.line or not w.uncovered"""
reason = "regrouping the guard makes it admit some files it would have skipped; those then run the scan and stale() rejects the same waivers, so no output differs and only a little work is wasted"

[[waiver]]
file = "mutation_gate/cli.py"
line = 57
column = 15
old = """w.file == rel and w.line"""
new = """w.file == rel or w.line"""
reason = "same short-circuit: a looser guard scans more files and stale() still filters by file, so the warnings are identical"

[[waiver]]
file = "mutation_gate/cli.py"
line = 57
column = 44
old = """not w.uncovered"""
new = """w.uncovered"""
reason = "an uncovered waiver names no line, so stale() excludes it either way; flipping this only changes whether a file with nothing but uncovered waivers is scanned before producing the same empty result"

