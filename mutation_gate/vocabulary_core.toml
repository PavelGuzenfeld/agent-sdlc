[collection]
types = ["list", "set", "dict", "tuple", "deque", "std::vector", "std::array", "std::map", "std::set"]

[convention.names]
python = [
  "main", "argv", "self", "cls", "args", "kwargs",
  "setUp", "tearDown", "setUpClass", "tearDownClass",
  "tmp_path", "tmp_path_factory", "tmpdir", "monkeypatch", "capsys", "capfd", "caplog",
  "request", "recwarn", "pytestconfig",
]
cpp = ["main", "argc", "argv"]
gdscript = [
  "_init", "_get", "_set", "_get_property_list", "_to_string", "_notification",
  "_iter_get", "_iter_init", "_iter_next", "_property_can_revert", "_property_get_revert",
  "_validate_property",
  "_enter_tree", "_exit_tree", "_ready", "_process", "_physics_process", "_input",
  "_unhandled_input", "_unhandled_key_input", "_shortcut_input", "_get_configuration_warnings",
  "_get_accessibility_configuration_warnings", "_get_focused_accessibility_element",
  "_draw",
  "_gui_input", "_can_drop_data", "_drop_data", "_get_drag_data", "_get_cursor_shape",
  "_get_minimum_size", "_get_maximum_size", "_get_tooltip", "_has_point",
  "_make_custom_tooltip", "_structured_text_parser", "_accessibility_get_contextual_info",
  "_get_accessibility_container_name", "_get_tooltip_auto_translate_mode_at",
]

[convention.prefixes]
gdscript = ["_on_"]

[function_words]
preposition = ["to", "from", "per", "of", "since", "by", "at", "in", "for", "with", "on", "into"]
determiner = ["all", "each", "every", "any"]
ordinal = ["first", "last", "next", "previous"]
particle = ["up", "down", "out", "off"]

[function_words.rejected]
and = "one action per name: split the function, or name the combined step"
or = "name the outcome, not the alternatives"
not = "name the positive predicate and negate at the call site"
no = "name the positive predicate and negate at the call site"

[path]
tool_dictated_files = ["__init__.py", "__main__.py", "_version.py"]
tool_dictated_globs = ["_*.so"]
exempt_files = [
  "CMakeLists.txt", "Dockerfile", "README.md", "CLAUDE.md", "CHANGELOG.md",
  "CONTRIBUTING.md", "LICENSE", "Makefile", "Doxyfile", "package.xml",
  "pyproject.toml", "setup.py", "setup.cfg", "Cargo.toml", "Cargo.lock",
]
exempt_patterns = [
  '^requirements.*\.txt$',
  '^\.',
  '^__init__\.py$',
  '^__main__\.py$',
  '^__pycache__$',
  '^py\.typed$',
  '^[A-Z][A-Z_-]*\.md$',
]
exempt_path_patterns = ['^\.']
