[[concept]]
word = "position"
meaning = "where a thing is, in some frame of reference"
pos = ["noun"]
reject = ["location", "pos"]
forms = ["plural"]

[[concept]]
word = "frame"
meaning = "one image or one sample of a stream, or a coordinate reference"
pos = ["noun"]
forms = ["plural"]

[[concept]]
word = "count"
meaning = "how many, or to find how many"
pos = ["noun", "verb"]
reject = ["num"]
forms = ["plural", "-s", "-ed", "-ing"]
head = true

[[concept]]
word = "index"
meaning = "the position of an element in an ordered collection"
pos = ["noun"]
reject = ["idx"]
forms = ["plural"]
irregular = { plural = "indices" }
head = true

[[concept]]
word = "test"
meaning = "a check that code does what its requirement says, or to run one"
pos = ["noun", "verb"]
forms = ["plural", "-s", "-ed", "-ing"]

[[concept]]
word = "read"
meaning = "take bytes or values from a source"
pos = ["verb"]
forms = ["-s", "-ed", "-ing", "-er"]
irregular = { "-ed" = "read" }
returns = "value"

[[concept]]
word = "parse"
meaning = "turn text or bytes into a structure"
pos = ["verb"]
forms = ["-s", "-ed", "-ing", "-er"]
returns = "value"

[[concept]]
word = "run"
meaning = "execute, or be executing"
pos = ["verb"]
forms = ["-s", "-ing", "-er"]

[[concept]]
word = "touch"
meaning = "meet at a boundary without overlapping"
pos = ["verb"]
forms = ["-s", "-ed", "-ing"]

[[concept]]
word = "overlap"
meaning = "share area or extent with another thing, or the shared part"
pos = ["verb", "noun"]
forms = ["-s", "plural"]
irregular = { "-ed" = "overlapped", "-ing" = "overlapping" }

[[concept]]
word = "distance"
meaning = "how far apart two positions are"
pos = ["noun"]
forms = ["plural"]

[[concept]]
word = "target"
meaning = "the thing an action or a measurement is aimed at"
pos = ["noun"]
forms = ["plural"]

[[concept]]
word = "byte"
meaning = "eight bits; the unit of a raw buffer"
pos = ["noun"]
forms = ["plural"]

[[concept]]
word = "circle"
meaning = "the set of points at one distance from a centre"
pos = ["noun"]
forms = ["plural"]

[[concept]]
word = "corner"
meaning = "where two edges of a shape meet"
pos = ["noun"]
forms = ["plural"]

[[concept]]
word = "heading"
meaning = "the direction a body points, as an angle from a reference direction"
pos = ["noun"]
forms = ["plural"]

[[concept]]
word = "zero"
meaning = "the value 0, or having that value"
pos = ["noun", "adjective"]
forms = ["plural"]

[[concept]]
word = "empty"
meaning = "holding nothing"
pos = ["adjective"]

[[concept]]
word = "health"
meaning = "how much damage a thing can still take before it is destroyed"
pos = ["noun"]

[[concept]]
word = "change"
meaning = "make or become different, or the resulting difference"
pos = ["verb", "noun"]
forms = ["plural", "-s", "-ed", "-ing"]

[[concept]]
word = "button"
meaning = "a control a user presses to trigger an action"
pos = ["noun"]
forms = ["plural"]

[[concept]]
word = "press"
meaning = "push something down, or trigger by pushing"
pos = ["verb"]
forms = ["-s", "-ed", "-ing"]

[[concept]]
word = "viewer"
meaning = "something that displays a stream of frames"
pos = ["noun"]
forms = ["plural"]
head = true

[[concept]]
word = "render"
meaning = "draw a visual representation"
pos = ["verb"]
forms = ["-s", "-ed", "-ing", "-er"]

[[concept]]
word = "use"
meaning = "employ or apply"
pos = ["verb"]
forms = ["-s", "-ed", "-ing", "-er"]

[[symbol]]
word = "i"
meaning = "loop index"

[[symbol]]
word = "n"
meaning = "an element count"

[[symbol]]
word = "x"
meaning = "first axis coordinate"

[[symbol]]
word = "y"
meaning = "second axis coordinate"

[[vague]]
word = "manager"
hint = "name what it does: scheduler, registry, pool, cache"

[[vague]]
word = "helper"
hint = "name the one thing it helps with"

[[vague]]
word = "util"
hint = "name the operation the module holds"

[[vague]]
word = "data"
hint = "name the kind of data: frame, sample, record"

[[vague]]
word = "info"
hint = "name what is known: version, status, size"

[collection]
types = ["list", "set", "dict", "tuple", "deque", "std::vector", "std::array", "std::map", "std::set"]

[convention]
names = [
  "main", "argc", "argv", "self", "cls", "args", "kwargs",
  "setUp", "tearDown", "setUpClass", "tearDownClass",
  "tmp_path", "tmp_path_factory", "tmpdir", "monkeypatch", "capsys", "capfd", "caplog",
  "request", "recwarn", "pytestconfig",
  "_ready", "_process", "_physics_process", "_input",
]
prefixes = ["_on_"]

[function_words]
preposition = ["to", "from", "per", "of", "since", "by", "at", "in", "for", "with", "on", "into"]
determiner = ["all", "each", "every", "any"]
ordinal = ["first", "last", "next", "previous"]
particle = ["up", "down", "out", "off"]

[function_words.rejected]
and = "one action per name: split the function, or name the combined step"
or = "name the outcome, not the alternatives"
not = "name the positive predicate and negate at the call site"
no = "name the positive predicate and negate at the call site"
