- id: rules-check
  name: rules check (.claude/rules drift)
  entry: mutation-gate rules check
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]
- id: mutation-gate
  name: mutation gate (diff-scoped)
  entry: mutation-gate --staged
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]
- id: commit-msg
  name: commit message check (voice.md banned words, attribution, sign-off)
  entry: mutation-gate commit-msg
  language: python
  stages: [commit-msg]
- id: diff-discipline
  name: diff discipline (branch line limit without a ticket reference)
  entry: mutation-gate diff-discipline
  language: python
  stages: [commit-msg]
- id: no-new-docs
  name: no new docs (newly added .md files must be allowlisted)
  entry: mutation-gate no-new-docs
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit]
- id: no-leaks
  name: no-leaks (identity/RFC1918/home-path scan plus optional banned_names_file)
  entry: mutation-gate no-leaks
  language: python
  stages: [commit-msg]
