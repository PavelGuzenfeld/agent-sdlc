- id: rules-check
  name: rules check (.claude/rules drift)
  entry: mutation-gate rules check
  language: python
  always_run: true
  pass_filenames: false
- id: mutation-gate
  name: mutation gate (diff-scoped)
  entry: mutation-gate --staged
  language: python
  always_run: true
  pass_filenames: false
- id: commit-msg
  name: commit message check (voice.md banned words, attribution, sign-off)
  entry: mutation-gate commit-msg
  language: python
  stages: [commit-msg]
